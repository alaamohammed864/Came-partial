 <!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03000b">
<title>Hand Tracking Magic</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: #03000b;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; width: 100%; height: 100%; }

  h1 {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    width: 100%;
    padding: 0 12px;
    text-align: center;
    font-size: clamp(16px, 4.5vw, 32px);
    color: #c77dff;
    text-shadow: 0 0 20px #a020f0;
    z-index: 2;
    pointer-events: none;
  }
  #camera {
    position: fixed;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    left: 16px;
    width: clamp(100px, 28vw, 220px);
    border: 2px solid #bd55ff;
    border-radius: 15px;
    transform: scaleX(-1);
    z-index: 3;
    display: none;
    background: #000;
  }
  #status {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 70px);
    left: 16px;
    right: 16px;
    font-size: clamp(12px, 3.2vw, 16px);
    color: #c77dff;
    z-index: 3;
    pointer-events: none;
  }
  #info {
    position: fixed;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    max-width: 55vw;
    text-align: right;
    font-size: clamp(11px, 3vw, 16px);
    color: #d8b4fe;
    line-height: 1.9;
    z-index: 3;
    pointer-events: none;
  }

  #start {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: rgba(3, 0, 11, 0.88);
    padding: 20px;
    text-align: center;
  }
  #start button {
    border: 0;
    border-radius: 999px;
    padding: 16px 30px;
    font-size: 18px;
    color: #fff;
    background: linear-gradient(135deg, #a020f0, #bd55ff);
    box-shadow: 0 0 25px #a020f0;
    cursor: pointer;
  }
  #start button.secondary {
    background: transparent;
    box-shadow: none;
    border: 1px solid #bd55ff;
    font-size: 15px;
    padding: 12px 22px;
  }
  #start p { color: #d8b4fe; max-width: 420px; line-height: 1.7; font-size: 14px; }
  #cursor {
    position: fixed;
    left: 0; top: 0;
    width: 60px; height: 60px;
    margin: -30px 0 0 -30px;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 25px #bd55ff, inset 0 0 15px #bd55ff;
    z-index: 4;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
<h1>✨ HAND TRACKING MAGIC ✨</h1>
<div id="status"></div>
<video id="camera" autoplay playsinline muted></video>
<div id="info"></div>
<div id="scene"></div>
<div id="cursor"></div>

<div id="start">
  <p>Qo'lingni kameraga ko'rsat — zarrachalar harakatlanadi.<br>
     لتحريك الجسيمات بيدك اسمح باستخدام الكاميرا.</p>
  <button id="btnCam">📷 Kamerani yoqish / تشغيل الكاميرا</button>
  <button id="btnTouch" class="secondary">👆 Kamerasiz / بدون كاميرا (لمس أو ماوس)</button>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js";

const MEDIAPIPE_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";
const WASM_URL = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
const MODEL_URL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";

const statusEl = document.getElementById("status");
const infoEl = document.getElementById("info");
const video = document.getElementById("camera");
const startEl = document.getElementById("start");
const cursorEl = document.getElementById("cursor");

const isMobile = matchMedia("(pointer: coarse)").matches || Math.min(innerWidth, innerHeight) < 600;
const COUNT = isMobile ? 2000 : 4500;

// ---------- THREE.JS ----------
const scene = new THREE.Scene();
const camera3D = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
camera3D.position.z = 10;

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
document.getElementById("scene").appendChild(renderer.domElement);

const positions = new Float32Array(COUNT * 3);
const home = new Float32Array(COUNT * 3);
const velocities = new Float32Array(COUNT * 3);
const colors = new Float32Array(COUNT * 3);

const geometry = new THREE.BufferGeometry();
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
scene.add(new THREE.Points(geometry, new THREE.PointsMaterial({
  size: isMobile ? 0.11 : 0.08,
  vertexColors: true,
  transparent: true,
  opacity: 0.9,
  blending: THREE.AdditiveBlending,
  depthWrite: false
})));

// الأبعاد المرئية في المستوى z=0
function viewSize() {
  const h = 2 * Math.tan(THREE.MathUtils.degToRad(camera3D.fov / 2)) * camera3D.position.z;
  return { w: h * camera3D.aspect, h };
}

function spawn() {
  const { w, h } = viewSize();
  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;
    home[i3]     = (Math.random() - 0.5) * w;
    home[i3 + 1] = (Math.random() - 0.5) * h;
    home[i3 + 2] = (Math.random() - 0.5) * 6;
    positions[i3] = home[i3];
    positions[i3 + 1] = home[i3 + 1];
    positions[i3 + 2] = home[i3 + 2];
    velocities[i3] = velocities[i3 + 1] = velocities[i3 + 2] = 0;
    const c = new THREE.Color().setHSL(0.74 + Math.random() * 0.1, 1, 0.6);
    colors[i3] = c.r; colors[i3 + 1] = c.g; colors[i3 + 2] = c.b;
  }
  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;
}
spawn();

let resizeTimer;
function onResize() {
  camera3D.aspect = innerWidth / innerHeight;
  camera3D.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(spawn, 200);
}
addEventListener("resize", onResize);
addEventListener("orientationchange", onResize);

// ---------- INPUT (hand / touch / mouse) ----------
const hand = { active: false, x: 0, y: 0, open: 1 };
let mode = "none"; // "camera" | "touch"

function pointerToWorld(e) {
  const { w, h } = viewSize();
  hand.x = (e.clientX / innerWidth - 0.5) * w;
  hand.y = (0.5 - e.clientY / innerHeight) * h;
}
addEventListener("pointermove", e => { if (mode === "touch") { pointerToWorld(e); hand.active = true; } });
addEventListener("pointerdown", e => { if (mode === "touch") { pointerToWorld(e); hand.active = true; hand.open = 0; } });
addEventListener("pointerup", e => {
  if (mode === "touch") { hand.open = 1; if (e.pointerType === "touch") hand.active = false; }
});

function setTouchMode() {
  mode = "touch";
  startEl.style.display = "none";
  statusEl.textContent = "Barmog'ing yoki sichqoncha bilan harakatlantir 👆";
  infoEl.innerHTML = "Harakatlantir — zarrachalar qochadi<br>Bos va ushla — zarrachalar tortiladi";
}

// ---------- CAMERA + MEDIAPIPE ----------
let handLandmarker = null;
let lastVideoTime = -1;

async function createLandmarker(vision, FilesetResolver) {
  const fileset = await FilesetResolver.forVisionTasks(WASM_URL);
  const make = delegate => vision.HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: MODEL_URL, delegate },
    runningMode: "VIDEO",
    numHands: 1
  });
  // على الهاتف نستخدم CPU لأن GPU يفشل بصمت في بعض الأجهزة
  if (isMobile) return await make("CPU");
  try { return await make("GPU"); }
  catch (e) { console.warn("GPU delegate failed, using CPU", e); return await make("CPU"); }
}

async function startCamera() {
  startEl.style.display = "none";
  statusEl.textContent = "Kamera ishga tushmoqda...";

  if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
    statusEl.textContent = "Kamera faqat HTTPS yoki localhost'da ishlaydi → touch rejimi.";
    return setTouchMode();
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    video.srcObject = stream;
    video.style.display = "block";
    await video.play();

    statusEl.textContent = "Model yuklanmoqda...";
    const mp = await import(MEDIAPIPE_URL);
    handLandmarker = await createLandmarker(mp, mp.FilesetResolver);

    mode = "camera";
    statusEl.textContent = "Tayyor! Qo'lingni ko'rsat ✋";
    infoEl.innerHTML = "Qo'lingni harakatlantir ✋<br>Barmoqlaringni och<br>Musht qil va effektni kuzat!";
  } catch (err) {
    console.error(err);
    video.style.display = "none";
    statusEl.textContent = "Kamera ishlamadi (" + (err.name || err.message) + ") → touch rejimi.";
    setTouchMode();
  }
}

document.getElementById("btnCam").addEventListener("click", startCamera);
document.getElementById("btnTouch").addEventListener("click", setTouchMode);

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function detect() {
  if (mode !== "camera" || !handLandmarker || video.readyState < 2 || !video.videoWidth) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;

  let res;
  try {
    res = handLandmarker.detectForVideo(video, performance.now());
  } catch (e) {
    console.error(e);
    statusEl.textContent = "Aniqlash xatosi: " + e.message;
    return;
  }
  if (res.landmarks && res.landmarks.length) {
    const lm = res.landmarks[0];
    const { w, h } = viewSize();
    hand.active = true;
    hand.x = (0.5 - lm[9].x) * w;          // الكاميرا معكوسة
    hand.y = (0.5 - lm[9].y) * h;
    const scale = dist(lm[0], lm[9]) || 0.1; // حجم الكف لتطبيع المسافة
    const tips = [8, 12, 16, 20];
    const avg = tips.reduce((s, t) => s + dist(lm[t], lm[0]), 0) / tips.length / scale;
    hand.open = avg > 1.6 ? 1 : 0;          // >1.6 يد مفتوحة، غير ذلك قبضة

    cursorEl.style.display = "block";
    cursorEl.style.transform = `translate(${(0.5 + hand.x / w) * innerWidth}px, ${(0.5 - hand.y / h) * innerHeight}px)`;
    cursorEl.style.borderColor = hand.open ? "#fff" : "#ff4d6d";
    statusEl.textContent = hand.open ? "Qo'l topildi ✋ (ochiq)" : "Qo'l topildi ✊ (musht)";
  } else {
    hand.active = false;
    cursorEl.style.display = "none";
    statusEl.textContent = "Qo'l ko'rinmayapti — kameraga ko'rsat ✋";
  }
}

// ---------- ANIMATION ----------
const RADIUS = 4.5;
function animate() {
  requestAnimationFrame(animate);
  detect();

  for (let i = 0; i < COUNT; i++) {
    const i3 = i * 3;
    let vx = velocities[i3], vy = velocities[i3 + 1], vz = velocities[i3 + 2];

    if (hand.active) {
      const dx = hand.x - positions[i3];
      const dy = hand.y - positions[i3 + 1];
      const d = Math.hypot(dx, dy) + 0.001;
      if (d < RADIUS) {
        const f = (1 - d / RADIUS) * 0.3;
        const dir = hand.open ? -1 : 1;     // مفتوحة = تنافر، قبضة = تجاذب
        vx += (dx / d) * f * dir;
        vy += (dy / d) * f * dir;
      }
    }
    // نابض يعيد الجسيم لمكانه الأصلي
    vx += (home[i3]     - positions[i3])     * 0.003;
    vy += (home[i3 + 1] - positions[i3 + 1]) * 0.003;
    vz += (home[i3 + 2] - positions[i3 + 2]) * 0.003;

    vx *= 0.94; vy *= 0.94; vz *= 0.94;
    velocities[i3] = vx; velocities[i3 + 1] = vy; velocities[i3 + 2] = vz;
    positions[i3] += vx; positions[i3 + 1] += vy; positions[i3 + 2] += vz;
  }
  geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, camera3D);
}
animate();
</script>
</body>
</html>
